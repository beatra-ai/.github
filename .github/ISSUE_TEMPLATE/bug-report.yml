name: Bug report · 问题反馈
description: A skill did something wrong, failed, or charged unexpectedly. Skill 出错、失败或扣费异常。
title: "[bug] <skill-name>: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not paste API keys, passwords, or private files here. Questions about your account or credits go to support@beatra.ai.
        感谢反馈。请不要粘贴 API Key、密码或私密文件；账号和积分问题请发邮件到 support@beatra.ai。
  - type: input
    id: skill
    attributes:
      label: Skill name · Skill 名称
      description: The folder name under `skills/`, e.g. `ai-logo-maker`. `skills/` 下的目录名。
      placeholder: ai-logo-maker
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skill version · 版本
      description: The `version` field in the skill's `manifest.json`. 见 Skill 目录里 `manifest.json` 的 `version` 字段。
      placeholder: 0.1.6
  - type: dropdown
    id: agent
    attributes:
      label: Agent · 使用的 Agent
      options:
        - Claude Code
        - Cursor
        - Codex
        - Windsurf
        - Cline
        - OpenClaw
        - Other · 其他
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: What you asked for · 你让 Agent 做了什么
      description: The request you gave the agent, and any input files described in words. 你的指令，以及输入素材的文字描述。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened · 实际结果
      description: Error messages, wrong output, or unexpected charges. Paste agent output as text. 报错、错误结果或异常扣费，请贴文字输出。
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected · 期望结果
    validations:
      required: true
  - type: input
    id: task
    attributes:
      label: Task ID · 任务 ID
      description: If the agent showed a Beatra task ID, paste it so we can trace the render. Agent 返回过任务 ID 的话请贴上，便于排查。
  - type: input
    id: os
    attributes:
      label: OS and Python version · 系统和 Python 版本
      placeholder: macOS 15, Python 3.12
